name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  # CI builds every workspace but never launches Electron.
  ELECTRON_SKIP_BINARY_DOWNLOAD: 1

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [20, 22]
        exclude:
          # better-sqlite3 ships no win32 prebuild for the Node 20 ABI
          # and the source build trips node-gyp's VS detection there;
          # Node 20 coverage stays on ubuntu/macos.
          - os: windows-latest
            node-version: 20
    runs-on: ${{ matrix.os }}

    steps:
      # Full history: the file-history append-only guard audits every
      # committed manifest version, which a shallow clone would skip.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Complete app and scaffold tests
        if: runner.os != 'Windows'
        run: npm test

      - name: Windows scaffold tests
        if: runner.os == 'Windows'
        run: npm test -w packages/cli

      - name: Windows UI tests
        if: runner.os == 'Windows'
        run: npm test -w packages/ui

      - name: Windows native host refusal
        if: runner.os == 'Windows'
        run: node --test packages/core/dist/platform.integration.test.js

  # The browser journeys (DR-039): the served UI driven in Chromium
  # against a real core with substitute agents — one lane, one OS.
  journeys:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser journeys
        run: npm run e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: journey-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7
